<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت خاموش است</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

            display: flex;
            justify-content: center;
            align-items: center;
            background: #101318;
            font-family: Tahoma, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            padding: 30px;
            max-width: 900px;
        }

        .icon {
            font-size: 75px;
            margin-bottom: 30px;
        }

        h1 {
            color: #ff3333;
            font-size: clamp(30px, 6vw, 65px);
            line-height: 1.8;
            text-shadow: 0 0 25px #ff000055;
        }

        p {
            color: #999;
            font-size: 15px;
            margin-top: 25px;
            direction: ltr;
        }

        .status {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 22px;
            border: 1px solid #ff3333;
            border-radius: 6px;
            color: #ff5555;
            letter-spacing: 2px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="icon">🛡️</div>

        <h1>
            سایت در حال حاضر به دلیل امنیت خاموش است
        </h1>

        <p>
            Website Temporarily Disabled for Security Reasons
        </p>

        <div class="status">
            SECURITY SHUTDOWN mohammadrezapy 
        </div>

    </div>

</html>
